name: Reproducible Build Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        node:
          - version: 20.19.0
            label: node20
          - version: 22.x
            label: node22
          - version: 24.x
            label: node24
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node.version }}
          cache: npm

      - name: Pin canonical npm
        run: npm install --global npm@10.8.2

      - name: Verify canonical npm
        run: test "$(npm --version)" = "10.8.2"

      - name: Install dependencies
        run: npm ci

      - name: i18n coverage
        run: npm run i18n:check

      - name: Build reproducible artifacts
        env:
          SOURCE_DATE_EPOCH: 1735689600
        run: npm run build:repro

      - name: Capture checksums
        run: cp dist/SHA256SUMS SHA256SUMS-${{ matrix.node.label }}.txt

      - name: Upload checksum artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sha256-${{ matrix.node.label }}
          path: SHA256SUMS-${{ matrix.node.label }}.txt

  compare:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download node20 checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sha256-node20
          path: checksums/node20

      - name: Download node22 checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sha256-node22
          path: checksums/node22

      - name: Download node24 checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sha256-node24
          path: checksums/node24

      - name: Compare checksums
        run: |
          diff -u checksums/node20/SHA256SUMS-node20.txt checksums/node22/SHA256SUMS-node22.txt
          diff -u checksums/node20/SHA256SUMS-node20.txt checksums/node24/SHA256SUMS-node24.txt
