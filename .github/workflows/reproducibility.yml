name: Reproducible Build Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        node:
          - version: 20.19.0
            label: node20
          - version: 22.x
            label: node22
          - version: 24.x
            label: node24
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node.version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: i18n coverage
        run: npm run i18n:check

      - name: Build reproducible artifacts
        env:
          SOURCE_DATE_EPOCH: 1735689600
        run: npm run build:repro

      - name: Capture checksums
        run: cp dist/SHA256SUMS SHA256SUMS-${{ matrix.node.label }}.txt

      - name: Upload checksum artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sha256-${{ matrix.node.label }}
          path: SHA256SUMS-${{ matrix.node.label }}.txt

  compare:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download node20 checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sha256-node20
          path: checksums/node20

      - name: Download node22 checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sha256-node22
          path: checksums/node22

      - name: Download node24 checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sha256-node24
          path: checksums/node24

      - name: Compare checksums
        run: |
          diff -u checksums/node20/SHA256SUMS-node20.txt checksums/node22/SHA256SUMS-node22.txt
          diff -u checksums/node20/SHA256SUMS-node20.txt checksums/node24/SHA256SUMS-node24.txt
