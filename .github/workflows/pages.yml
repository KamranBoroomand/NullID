name: Deploy NullID to GitHub Pages (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 20.19.0
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run e2e:install

      - name: Typecheck
        run: npm run typecheck

      - name: i18n coverage
        run: npm run i18n:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Playwright e2e (includes RU/FA layout integrity)
        run: CI=1 npm run e2e

      - name: Production PWA e2e (offline + upgrade)
        run: CI=1 npm run test:e2e:production

      - name: Build
        env:
          VITE_BASE: /
          VITE_BUILD_ID: ${{ github.sha }}
          VITE_BUILD_TIMESTAMP: ${{ github.run_started_at }}
        run: npm run build

      - name: Verify build manifest
        run: npm run verify:build

      - name: Assert guide
        run: node scripts/assert-guide.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: dist

  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
