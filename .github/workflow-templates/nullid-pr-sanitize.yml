name: NullID PR Sanitize Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  sanitize-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run NullID precommit policy check on PR diff
        run: npm run cli -- precommit --git-range "origin/${{ github.base_ref }}...HEAD" --baseline nullid.policy.json --threshold high
